# Composite factor weights used by factors.compute_composite_score.
# Weights within a playbook should sum to 1.0. NaN sub-scores are excluded
# from the weighted denominator at scoring time.
#
# playbook_a: long-bias, value-quality tilt.
# playbook_b: short / mean-reversion candidates (some factor signs invert
# inside directional thesis scoring; the weights below are absolute).

playbook_a:
  value_score: 0.25
  quality_score: 0.20
  momentum_score: 0.20
  lowvol_score: 0.15
  revisions_score: 0.10
  news_activity_score: 0.10   # A.3.10 addition per spec section 9.3

playbook_b:
  value_score: 0.25
  quality_score: 0.10
  momentum_score: 0.25
  lowvol_score: 0.10
  revisions_score: 0.15
  news_activity_score: 0.15   # A.3.10 addition per spec section 9.3

# Pillar weights inside compute_quality_score
quality_pillars:
  profitability: 0.40
  growth: 0.25
  safety: 0.20
  capital: 0.15

# Sub-weights inside compute_value_score
value_subweights:
  earnings_yield: 0.30
  ebit_yield: 0.30
  fcf_yield: 0.25
  book_to_market: 0.15

# Multi-horizon weights inside compute_momentum_score
momentum_horizons:
  mom_3m: 0.25
  mom_6m: 0.35
  mom_12m: 0.40

# Sub-weights inside compute_lowvol_score (all negative-loaded)
lowvol_subweights:
  realized_vol: 0.40
  beta: 0.25
  idio_vol: 0.35

# A.3.10 additions ----------------------------------------------------------

# Realized-vol estimator choice for compute_lowvol_score. Per spec
# section 8 / 12.1: Yang-Zhang replaces close-to-close 60d. Falls back
# to close-to-close when OHLC data is unavailable (close-only series).
realized_vol:
  estimator: yang_zhang
  window_days: 60

# Sub-signal weights inside compute_news_activity_score. Initial weights
# per spec section 7.3, derived from literature alpha estimates. Phase H
# empirically recalibrates against trade history. Weights for missing
# signals are redistributed proportionally to surviving signals at
# scoring time (spec section 7.4).
news_activity_subweights:
  opportunistic_insider: 0.30   # Cohen-Malloy-Pomorski 2012 -- lead alpha
  short_interest_delta: 0.15    # Diether-Lee-Werner 2009
  revisions_velocity: 0.15      # Chan-Jegadeesh-Lakonishok 1996
  news_volume_anomaly: 0.10     # Tetlock 2007
  filing_density: 0.10          # Lee-So 2017
  lm_tone: 0.15                 # Loughran-McDonald 2011 / 2014
  fears: 0.05                   # Da-Engelberg-Gao 2015 (contrarian, sign-flipped inside)
