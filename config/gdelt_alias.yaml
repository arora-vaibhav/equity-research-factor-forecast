# Static alias table: ticker → list of company-name substrings to match
# against the GDELT GKG V1ORGANIZATIONS column.
#
# v1 covers the top-50 US stocks by market cap. The long tail relies on
# cashtag matches.  Add aliases here when news_volume_anomaly signal
# proves itself in A.3.10 backtesting.
#
# Matching is case-insensitive substring: if ANY alias appears in the
# semicolon-separated V1ORGANIZATIONS string, the row is attributed
# to that ticker with match_method='alias'.
#
# WARNING: do not use short / ambiguous aliases (e.g. "Apple" for AAPL
# would also match "Pineapple Corp").  Use full legal names.

aliases:
  AAPL:
    - "Apple Inc"
    - "Apple Computer"
  MSFT:
    - "Microsoft Corp"
    - "Microsoft Corporation"
  GOOGL:
    - "Alphabet Inc"
    - "Google LLC"
    - "Google Inc"
